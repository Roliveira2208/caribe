packages:
  - "apps/*"
  - "packages/*"

# pnpm 12: los paquetes con scripts de instalación necesitan aprobación
# explícita. esbuild (vitest/vite) valida su binario; prisma y @prisma/engines
# descargan los motores que usa el CLI de migraciones; @swc/core y
# @parcel/watcher validan los bindings nativos que usa Next 16 (SWC y watcher).
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  # Acelerador nativo opcional de msgpackr (dependencia de BullMQ): sin el
  # binario, msgpackr usa su implementación JavaScript.
  msgpackr-extract: false
  prisma: true

overrides:
  # GHSA-g3hv-75wg-m249: ReDoS en minimatch < 11.0.1 (audit prod, T-F1-10b).
  minimatch: ">=11.0.1"

minimumReleaseAgeExclude:
  - icu-minify@4.14.10
  - next-intl-swc-plugin-extractor@4.14.10
  - next-intl@4.14.10
  - use-intl@4.14.10
