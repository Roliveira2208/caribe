<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1290" width="1200" height="1290" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Checkout — escritorio</title>
  <desc id="wf-desc">Wireframe de baja fidelidad del checkout en tres pasos: datos del viajero con resumen y selector de moneda, pago con temporizador de retención del cupo y métodos simulados, y confirmación con estado del pago en revisión y voucher de reserva con la leyenda de documento no fiscal.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .price { font-size: 17px; font-weight: 700; }
    .ves { font-size: 11.5px; fill: #555; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .ph { fill: #f2f2f2; stroke: #bbb; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .chip { fill: #fff; stroke: #777; stroke-width: 1; }
    .radio { fill: #fff; stroke: #777; stroke-width: 1.2; }
    .rDot { fill: #555; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .mark { fill: #fff; stroke: #666; stroke-width: 1.2; }
    .marktxt { font-size: 12px; font-weight: 700; }
    .x { stroke: #ccc; stroke-width: 1; }
    .sep { stroke: #ddd; stroke-width: 1; }
    .progress { fill: #ccc; }
  </style>

  <!-- Encabezado del wireframe -->
  <text x="16" y="28" class="cap">Caribe · Web — Checkout · escritorio · pasos 1 a 3 · wireframe de baja fidelidad · es</text>

  <!-- Paso 1: viajero y resumen -->
  <rect x="16" y="44" width="1168" height="300" class="box"/>
  <text x="32" y="74" class="h2">1 · Viajero y resumen</text>

  <text x="32" y="104" class="lbl">Nombre completo</text>
  <rect x="32" y="112" width="400" height="36" class="field"/>
  <text x="44" y="135" class="val">María Pérez</text>
  <text x="32" y="170" class="lbl">Email</text>
  <rect x="32" y="178" width="400" height="36" class="field"/>
  <text x="44" y="201" class="val">maria@demo.example</text>
  <text x="32" y="236" class="lbl">Teléfono</text>
  <rect x="32" y="244" width="190" height="36" class="field"/>
  <text x="44" y="267" class="val">+58 412 0000000</text>
  <text x="240" y="236" class="lbl">Documento de identidad</text>
  <rect x="240" y="244" width="192" height="36" class="field"/>
  <text x="252" y="267" class="val">V-0000000</text>

  <rect x="480" y="96" width="688" height="216" class="panel"/>
  <text x="496" y="124" class="h2">Resumen</text>
  <text x="496" y="150" class="val">Tour Cayo de Agua · Los Roques</text>
  <text x="496" y="170" class="val">15/11/2026 · 2 adultos · 1 día</text>
  <line x1="496" y1="188" x2="1152" y2="188" class="sep"/>
  <text x="496" y="214" class="lbl">Total (USD)</text>
  <text x="496" y="242" class="price">$240 USD</text>
  <circle cx="1112" cy="238" r="11" class="mark"/>
  <text x="1112" y="242" class="marktxt" text-anchor="middle">1</text>
  <text x="496" y="264" class="ves">≈ 8.640,00 Bs · tasa BCV 10/11/2026</text>
  <text x="496" y="294" class="lbl">Moneda del pago:</text>
  <circle cx="612" cy="290" r="7" class="radio"/>
  <circle cx="612" cy="290" r="3" class="rDot"/>
  <text x="626" y="294" class="lbl">USD</text>
  <circle cx="676" cy="290" r="7" class="radio"/>
  <text x="690" y="294" class="lbl">VES</text>
  <rect x="984" y="294" width="184" height="36" class="btnbox"/>
  <text x="1076" y="317" class="btn" text-anchor="middle">Continuar al pago</text>

  <!-- Paso 2: pago -->
  <rect x="16" y="364" width="1168" height="330" class="box"/>
  <text x="32" y="394" class="h2">2 · Pago</text>

  <rect x="32" y="408" width="700" height="80" class="panel"/>
  <circle cx="52" cy="428" r="11" class="mark"/>
  <text x="52" y="432" class="marktxt" text-anchor="middle">2</text>
  <text x="68" y="432" class="h2">Cupo retenido · 29:41</text>
  <rect x="68" y="444" width="560" height="12" class="field"/>
  <rect x="68" y="444" width="552" height="12" class="progress"/>
  <text x="68" y="470" class="note">Retención de 30 min (hold_minutes): si vence, el cupo se libera y la reserva pasa a EXPIRED.</text>

  <rect x="756" y="408" width="412" height="80" class="panel"/>
  <text x="772" y="428" class="lbl">Monto a pagar</text>
  <text x="772" y="452" class="price">8.640,00 Bs</text>
  <circle cx="1108" cy="448" r="11" class="mark"/>
  <text x="1108" y="452" class="marktxt" text-anchor="middle">1</text>
  <text x="772" y="474" class="note">USD 240,00 · tasa BCV 10/11/2026, congelada al iniciar el pago</text>

  <text x="32" y="520" class="lbl">Método de pago (simulado)</text>
  <circle cx="44" cy="544" r="7" class="radio"/>
  <circle cx="44" cy="544" r="3" class="rDot"/>
  <text x="58" y="548" class="lbl">Pago Móvil</text>
  <circle cx="170" cy="544" r="7" class="radio"/>
  <text x="184" y="548" class="lbl">Zelle</text>
  <circle cx="252" cy="544" r="7" class="radio"/>
  <text x="266" y="548" class="lbl">Binance Pay</text>
  <circle cx="392" cy="544" r="7" class="radio"/>
  <text x="406" y="548" class="lbl">Tarjeta</text>

  <text x="32" y="584" class="lbl">Banco</text>
  <rect x="32" y="592" width="200" height="36" class="field"/>
  <text x="44" y="615" class="val">Banco de Venezuela</text>
  <text x="252" y="584" class="lbl">Teléfono</text>
  <rect x="252" y="592" width="200" height="36" class="field"/>
  <text x="264" y="615" class="val">+58 412 0000000</text>
  <text x="472" y="584" class="lbl">Referencia</text>
  <rect x="472" y="592" width="240" height="36" class="field"/>
  <rect x="484" y="600" width="130" height="8" class="line"/>
  <rect x="736" y="592" width="168" height="36" class="btnbox"/>
  <text x="820" y="615" class="btn" text-anchor="middle">Reportar pago</text>
  <text x="920" y="615" class="note">El pago queda en revisión (IN_REVIEW).</text>

  <!-- Paso 3: confirmación -->
  <rect x="16" y="714" width="1168" height="360" class="box"/>
  <text x="32" y="744" class="h2">3 · Confirmación</text>

  <rect x="32" y="762" width="252" height="30" class="chip"/>
  <text x="44" y="782" class="lbl">Pago en revisión · IN_REVIEW</text>
  <circle cx="300" cy="777" r="11" class="mark"/>
  <text x="300" y="781" class="marktxt" text-anchor="middle">3</text>
  <text x="32" y="818" class="note">Según el modo de la agencia, el pago se aprueba al instante (AUTO)</text>
  <text x="32" y="836" class="note">o lo revisa un administrador (MANUAL).</text>

  <rect x="32" y="856" width="520" height="200" class="box"/>
  <text x="48" y="886" class="h2">VOUCHER DE RESERVA</text>
  <text x="48" y="908" class="lbl">Código: CR-2026-0001</text>
  <rect x="448" y="876" width="88" height="88" class="ph"/>
  <line x1="448" y1="876" x2="536" y2="964" class="x"/>
  <line x1="536" y1="876" x2="448" y2="964" class="x"/>
  <text x="492" y="924" class="lbl" text-anchor="middle">QR</text>
  <line x1="48" y1="922" x2="520" y2="922" class="sep"/>
  <text x="48" y="944" class="lbl">Tour Cayo de Agua · Los Roques</text>
  <text x="48" y="962" class="lbl">15/11/2026 · 2 adultos</text>
  <text x="48" y="980" class="lbl">Viajero: María Pérez</text>
  <text x="48" y="998" class="lbl">Total: $240 USD · 8.640,00 Bs · tasa BCV 10/11/2026</text>
  <line x1="48" y1="1010" x2="520" y2="1010" class="sep"/>
  <circle cx="62" cy="1030" r="11" class="mark"/>
  <text x="62" y="1034" class="marktxt" text-anchor="middle">4</text>
  <text x="80" y="1036" class="h2">DOCUMENTO NO FISCAL</text>

  <text x="600" y="790" class="h2">Qué pasa ahora</text>
  <text x="600" y="812" class="note">1. Revisión del pago (IN_REVIEW): automática en modo AUTO o por un admin en MANUAL.</text>
  <text x="600" y="830" class="note">2. Al aprobar: la reserva pasa a CONFIRMED y el voucher llega por correo.</text>
  <text x="600" y="848" class="note">3. Si vence la retención sin pago: la reserva pasa a EXPIRED y el cupo se libera.</text>
  <rect x="600" y="872" width="240" height="36" class="btnbox"/>
  <text x="720" y="895" class="btn" text-anchor="middle">Descargar voucher (PDF)</text>
  <rect x="856" y="872" width="260" height="36" class="btnbox"/>
  <text x="986" y="895" class="btn" text-anchor="middle">Descargar comprobante (PDF)</text>
  <text x="600" y="940" class="note">Ambos PDF llevan la leyenda «Documento no fiscal».</text>
  <text x="600" y="980" class="lbl">Ver en Mis reservas ›</text>

  <!-- Reglas visibles -->
  <rect x="16" y="1094" width="1168" height="176" class="notes"/>
  <text x="32" y="1118" class="notetitle">Reglas visibles en esta pantalla</text>
  <text x="32" y="1140" class="note">[1] Al iniciar el pago se registra la tasa BCV del día y el monto en VES queda congelado; nunca se recalcula.</text>
  <text x="32" y="1158" class="note">[2] El cupo se retiene 30 min (hold_minutes) con cuenta regresiva visible; al vencer, la reserva pasa a EXPIRED.</text>
  <text x="32" y="1176" class="note">[3] El pago nace IN_REVIEW: en modo AUTO se aprueba al instante; en MANUAL lo revisa un administrador.</text>
  <text x="32" y="1194" class="note">[4] Voucher y comprobante llevan siempre la leyenda «Documento no fiscal».</text>
  <text x="32" y="1212" class="note">El selector de moneda USD/VES cambia lo que ve el cliente; el monto se calcula siempre en el servidor.</text>
  <text x="32" y="1230" class="note">Versión móvil de este flujo: checkout-movil.svg (mismas reglas, columna única).</text>
</svg>
