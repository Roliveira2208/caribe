<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="wf-title wf-desc">
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <title id="wf-title">Panel de reportes — admin</title>
  <desc id="wf-desc">Wireframe de baja fidelidad del reporte de ventas: rango de fechas inclusivo en America/Caracas, filtro de agencia por rol, totales USD y VES calculados en el servidor con tasas congeladas, desglose por método y estado, descarga CSV con los mismos filtros y alcance por rol.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .primary { fill: #F4A300; stroke: #B37A00; stroke-width: 1.2; }
    .chip { fill: #fff; stroke: #777; stroke-width: 1; }
    .active { fill: #0E2A3D; stroke: #0E2A3D; }
    .activeText { font-size: 12.5px; font-weight: 600; fill: #fff; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .sep { stroke: #ddd; stroke-width: 1; }
  </style>

  <text x="16" y="28" class="cap">Caribe Admin — Reportes · escritorio · wireframe de baja fidelidad · es / en</text>

  <!-- Header del panel -->
  <rect x="16" y="44" width="1168" height="44" class="box"/>
  <text x="32" y="72" class="h1">Caribe Admin</text>
  <rect x="724" y="56" width="252" height="22" class="chip"/>
  <text x="736" y="72" class="lbl">Admin de agencia · Agencia Sol</text>
  <text x="992" y="72" class="lbl">o Super Admin · plataforma</text>
  <text x="1116" y="72" class="lbl">ES | EN</text>

  <!-- Pestañas -->
  <rect x="16" y="100" width="1168" height="36" class="panel"/>
  <rect x="24" y="106" width="112" height="24" class="active"/>
  <text x="38" y="122" class="activeText">Reportes</text>
  <text x="160" y="122" class="note">Solo lectura · agente, proveedor y member: 403 sin datos</text>

  <!-- Filtros -->
  <rect x="16" y="150" width="1168" height="92" class="box"/>
  <text x="32" y="172" class="lbl">Desde</text>
  <rect x="32" y="178" width="160" height="32" class="field"/>
  <text x="44" y="199" class="val">2026-11-01</text>
  <text x="208" y="172" class="lbl">Hasta</text>
  <rect x="208" y="178" width="160" height="32" class="field"/>
  <text x="220" y="199" class="val">2026-11-25</text>
  <text x="384" y="172" class="lbl">Agencia</text>
  <rect x="384" y="178" width="220" height="32" class="field"/>
  <text x="396" y="199" class="val">Todas (solo plataforma) ▾</text>
  <rect x="620" y="178" width="120" height="32" class="primary"/>
  <text x="680" y="199" class="btn" text-anchor="middle">Aplicar</text>
  <rect x="1012" y="178" width="152" height="32" class="btnbox"/>
  <text x="1088" y="199" class="btn" text-anchor="middle">Descargar CSV</text>
  <text x="756" y="190" class="note">[1] mismos filtros para JSON y CSV</text>
  <text x="32" y="229" class="note">Fechas YYYY-MM-DD, inclusivas en America/Caracas · rango invertido o inválido → 422 sin datos parciales</text>
  <text x="620" y="229" class="note">Admin: solo su agencia aunque pida otra · Super Admin: plataforma o una agencia</text>

  <!-- Totales del servidor -->
  <text x="16" y="268" class="h2">Totales del rango</text>
  <rect x="16" y="278" width="280" height="84" class="panel"/>
  <text x="32" y="302" class="lbl">Total USD · DECIMAL</text>
  <text x="32" y="336" class="h1">12,480.50</text>
  <rect x="312" y="278" width="280" height="84" class="panel"/>
  <text x="328" y="302" class="lbl">Total VES · montos congelados</text>
  <text x="328" y="336" class="h1">998,440.00</text>
  <rect x="608" y="278" width="200" height="84" class="panel"/>
  <text x="624" y="302" class="lbl">Pagos en rango</text>
  <text x="624" y="336" class="h1">37</text>
  <rect x="824" y="278" width="360" height="84" class="notes"/>
  <text x="840" y="302" class="notetitle">[2] Reglas de dinero</text>
  <text x="840" y="322" class="note">Cadenas con 2 decimales; tasas con 4, del pago.</text>
  <text x="840" y="342" class="note">La tasa vigente al consultar nunca recalcula el total.</text>

  <!-- Desglose por método y estado -->
  <text x="16" y="390" class="h2">Desglose por método y estado</text>
  <rect x="16" y="400" width="1168" height="208" class="box"/>
  <rect x="16" y="400" width="1168" height="32" class="panel"/>
  <text x="32" y="421" class="lbl">Método</text>
  <text x="256" y="421" class="lbl">Estado</text>
  <text x="460" y="421" class="lbl">Recuento</text>
  <text x="620" y="421" class="lbl">Suma USD</text>
  <text x="860" y="421" class="lbl">Suma VES</text>
  <line x1="16" y1="432" x2="1184" y2="432" class="sep"/>
  <text x="32" y="458" class="val">Zelle</text>
  <rect x="256" y="444" width="148" height="24" class="chip"/>
  <text x="264" y="460" class="lbl">APPROVED</text>
  <text x="460" y="458" class="val">18</text>
  <text x="620" y="458" class="val">6,240.00</text>
  <text x="860" y="458" class="val">499,200.00</text>
  <line x1="16" y1="476" x2="1184" y2="476" class="sep"/>
  <text x="32" y="502" class="val">Binance Pay</text>
  <rect x="256" y="488" width="148" height="24" class="chip"/>
  <text x="264" y="504" class="lbl">IN_REVIEW</text>
  <text x="460" y="502" class="val">12</text>
  <text x="620" y="502" class="val">4,180.50</text>
  <text x="860" y="502" class="val">334,440.00</text>
  <line x1="16" y1="520" x2="1184" y2="520" class="sep"/>
  <text x="32" y="546" class="val">Zelle</text>
  <rect x="256" y="532" width="148" height="24" class="chip"/>
  <text x="264" y="548" class="lbl">REJECTED</text>
  <text x="460" y="546" class="val">7</text>
  <text x="620" y="546" class="val">2,060.00</text>
  <text x="860" y="546" class="val">164,800.00</text>
  <line x1="16" y1="564" x2="1184" y2="564" class="sep"/>
  <text x="32" y="590" class="note">Sin pagos en el rango: listas vacías y totales «0.00»; sin filas inventadas.</text>

  <!-- Notas y alcance -->
  <rect x="16" y="624" width="1168" height="136" class="notes"/>
  <text x="32" y="648" class="notetitle">Notas de contrato</text>
  <text x="32" y="670" class="note">[1] GET /admin/reports/sales y su CSV aplican los mismos filtros, validaciones y alcance por rol.</text>
  <text x="32" y="690" class="note">CSV UTF-8, encabezados es/en según idioma activo; sin número de tarjeta, CVV, tokens ni secretos.</text>
  <text x="32" y="710" class="note">Super Admin lee plataforma o una agencia; Admin solo la suya; agente, proveedor y member reciben 403.</text>
  <text x="32" y="730" class="note">Preguntas abiertas: límite/streaming del CSV para rangos grandes e idioma del CSV sin preferencia.</text>
  <text x="32" y="748" class="note">Todas las etiquetas y mensajes salen de catálogos es/en y los controles son accesibles por teclado.</text>
</svg>
