<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="wf-title wf-desc">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <title id="wf-title">Panel de usuarios y roles — admin</title>
  <desc id="wf-desc">Wireframe de baja fidelidad de usuarios y roles: invitación, cambio de rol y revocación de sesiones con Better Auth, exigencia de segundo factor, organización objetivo, modo plataforma del Super Admin, auditoría antes/después y eventos de autenticación.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .primary { fill: #F4A300; stroke: #B37A00; stroke-width: 1.2; }
    .chip { fill: #fff; stroke: #777; stroke-width: 1; }
    .active { fill: #0E2A3D; stroke: #0E2A3D; }
    .activeText { font-size: 12.5px; font-weight: 600; fill: #fff; }
    .ok { fill: #E6F7F6; stroke: #1FA6A0; stroke-width: 1; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .sep { stroke: #ddd; stroke-width: 1; }
  </style>

  <text x="16" y="28" class="cap">Caribe Admin — Usuarios y roles · escritorio · wireframe de baja fidelidad · es / en</text>

  <!-- Cabecera y ámbito -->
  <rect x="16" y="44" width="1168" height="44" class="box"/>
  <text x="32" y="72" class="h1">Caribe Admin</text>
  <rect x="690" y="56" width="264" height="22" class="chip"/>
  <text x="702" y="72" class="lbl">Agencia activa: Agencia Sol ▾</text>
  <text x="966" y="72" class="lbl">o Super Admin · plataforma</text>
  <text x="1116" y="72" class="lbl">ES | EN</text>

  <!-- Pestañas -->
  <rect x="16" y="100" width="1168" height="36" class="panel"/>
  <rect x="24" y="106" width="104" height="24" class="active"/>
  <text x="38" y="122" class="activeText">Miembros</text>
  <rect x="136" y="106" width="112" height="24" class="chip"/>
  <text x="148" y="122" class="lbl">Sesiones</text>
  <rect x="256" y="106" width="112" height="24" class="chip"/>
  <text x="268" y="122" class="lbl">Agencias</text>
  <text x="388" y="122" class="note">Agencias: solo Super Admin · sin fijar agencia activa</text>

  <!-- Filtros y acciones -->
  <text x="16" y="158" class="lbl">Buscar miembro</text>
  <rect x="16" y="166" width="220" height="32" class="field"/>
  <text x="28" y="187" class="val">Nombre o correo…</text>
  <text x="252" y="158" class="lbl">Rol</text>
  <rect x="252" y="166" width="148" height="32" class="field"/>
  <text x="264" y="187" class="val">Todos ▾</text>
  <rect x="1064" y="166" width="120" height="32" class="primary"/>
  <text x="1084" y="187" class="btn">Invitar</text>

  <!-- Tabla de miembros -->
  <rect x="16" y="216" width="1168" height="236" class="box"/>
  <rect x="16" y="216" width="1168" height="30" class="panel"/>
  <text x="28" y="236" class="h2">Miembros de la agencia activa</text>
  <text x="900" y="236" class="note">2FA obligatorio para escribir</text>
  <line x1="16" y1="246" x2="1184" y2="246" class="sep"/>
  <text x="28" y="266" class="lbl">Miembro</text>
  <text x="332" y="266" class="lbl">Rol</text>
  <text x="480" y="266" class="lbl">2FA</text>
  <text x="576" y="266" class="lbl">Última sesión</text>
  <text x="790" y="266" class="lbl">Acciones</text>
  <line x1="16" y1="274" x2="1184" y2="274" class="sep"/>

  <text x="28" y="298" class="val">Ana Pérez · ana@ejemplo.com</text>
  <rect x="332" y="284" width="112" height="24" class="field"/>
  <text x="342" y="300" class="val">owner ▾</text>
  <rect x="480" y="284" width="64" height="24" class="ok"/>
  <text x="494" y="300" class="val">activo</text>
  <text x="576" y="300" class="val">25/11 18:02</text>
  <text x="790" y="300" class="val">Cambiar rol · Revocar sesiones</text>

  <text x="28" y="338" class="val">Luis Gómez · luis@ejemplo.com</text>
  <rect x="332" y="324" width="112" height="24" class="field"/>
  <text x="342" y="340" class="val">admin ▾</text>
  <rect x="480" y="324" width="64" height="24" class="ok"/>
  <text x="494" y="340" class="val">activo</text>
  <text x="576" y="340" class="val">25/11 17:41</text>
  <text x="790" y="340" class="val">Cambiar rol · Revocar sesiones</text>

  <text x="28" y="378" class="val">Sofía Díaz · sofia@ejemplo.com</text>
  <rect x="332" y="364" width="112" height="24" class="field"/>
  <text x="342" y="380" class="val">provider ▾</text>
  <text x="480" y="380" class="val">pendiente</text>
  <text x="576" y="380" class="val">24/11 09:15</text>
  <text x="790" y="380" class="val">Cambiar rol · Revocar sesiones</text>

  <text x="28" y="418" class="val">Carlos Ruiz · carlos@ejemplo.com</text>
  <rect x="332" y="404" width="112" height="24" class="field"/>
  <text x="342" y="420" class="val">member ▾</text>
  <text x="480" y="420" class="val">pendiente</text>
  <text x="576" y="420" class="val">—</text>
  <text x="790" y="420" class="val">Cambiar rol · Revocar sesiones</text>

  <line x1="16" y1="432" x2="1184" y2="432" class="sep"/>
  <text x="28" y="448" class="note">owner/admin: invitar, cambiar rol y revocar · agent/provider/member: sin acciones · Super Admin: agencias, no escrituras de agencia</text>

  <!-- Modal de invitación -->
  <rect x="16" y="472" width="376" height="252" class="notes"/>
  <text x="32" y="496" class="notetitle">Invitar miembro</text>
  <text x="32" y="522" class="lbl">Correo</text>
  <rect x="32" y="530" width="344" height="28" class="field"/>
  <text x="42" y="549" class="val">nombre@ejemplo.com</text>
  <text x="32" y="576" class="lbl">Rol</text>
  <rect x="32" y="584" width="160" height="28" class="field"/>
  <text x="42" y="603" class="val">admin ▾</text>
  <text x="208" y="576" class="lbl">Organización objetivo</text>
  <rect x="208" y="584" width="168" height="28" class="field"/>
  <text x="218" y="603" class="val">Agencia Sol ▾</text>
  <text x="32" y="638" class="note">Solo organizaciones de las membresías del actor</text>
  <rect x="32" y="656" width="104" height="28" class="btnbox"/>
  <text x="56" y="675" class="btn">Cancelar</text>
  <rect x="152" y="656" width="120" height="28" class="primary"/>
  <text x="174" y="675" class="btn">Enviar invitación</text>
  <text x="292" y="675" class="note">Requiere TOTP</text>

  <!-- Modal de cambio de rol -->
  <rect x="408" y="472" width="376" height="252" class="notes"/>
  <text x="424" y="496" class="notetitle">Cambiar rol</text>
  <text x="424" y="522" class="lbl">Miembro</text>
  <text x="528" y="522" class="val">Luis Gómez</text>
  <rect x="424" y="530" width="150" height="28" class="field"/>
  <text x="434" y="549" class="val">admin (antes)</text>
  <text x="592" y="549" class="val">→</text>
  <rect x="614" y="530" width="150" height="28" class="field"/>
  <text x="624" y="549" class="val">provider ▾ (después)</text>
  <text x="424" y="584" class="lbl">Organización objetivo</text>
  <rect x="424" y="592" width="340" height="28" class="field"/>
  <text x="434" y="611" class="val">Agencia Sol (de la sesión o del cuerpo)</text>
  <text x="424" y="646" class="note">audit_logs: before/after · auth_events: attempt/result</text>
  <rect x="424" y="656" width="104" height="28" class="btnbox"/>
  <text x="448" y="675" class="btn">Cancelar</text>
  <rect x="544" y="656" width="152" height="28" class="primary"/>
  <text x="566" y="675" class="btn">Confirmar cambio</text>

  <!-- Modal de sesiones -->
  <rect x="800" y="472" width="384" height="252" class="notes"/>
  <text x="816" y="496" class="notetitle">Revocar sesiones</text>
  <text x="816" y="522" class="lbl">Usuario</text>
  <text x="912" y="522" class="val">Sofía Díaz</text>
  <rect x="816" y="532" width="352" height="24" class="panel"/>
  <text x="826" y="549" class="val">☑ Chrome · 25/11 17:20 ·IP mostrada como «—»</text>
  <rect x="816" y="560" width="352" height="24" class="panel"/>
  <text x="826" y="577" class="val">☐ Safari · 24/11 09:15 ·IP mostrada como «—»</text>
  <text x="816" y="612" class="note">La sesión revocada responde 401 en la siguiente petición</text>
  <text x="816" y="632" class="note">before/after de la sesión · correlación con auth_events</text>
  <rect x="816" y="656" width="104" height="28" class="btnbox"/>
  <text x="840" y="675" class="btn">Cancelar</text>
  <rect x="936" y="656" width="160" height="28" class="primary"/>
  <text x="956" y="675" class="btn">Revocar selección</text>

  <!-- Notas de contrato -->
  <rect x="16" y="744" width="1168" height="140" class="notes"/>
  <text x="32" y="768" class="notetitle">Reglas de la API y del panel</text>
  <text x="32" y="790" class="note">[1] Solo /api/auth/organization/* y /api/auth/admin/* existentes: sin plugins, API keys, bearer, SSO ni OAuth nuevos.</text>
  <text x="32" y="810" class="note">[2] Sin TOTP: 403 TWO_FACTOR_REQUIRED antes de validar el cuerpo; sin agencia activa: 403 ACTIVE_ORGANIZATION_REQUIRED y estado vacío con selector.</text>
  <text x="32" y="830" class="note">[3] organizationId ajeno se rechaza sin escribir ni imputar auditoría a la otra agencia; la UI solo ofrece las membresías del actor.</text>
  <text x="32" y="850" class="note">[4] Super Admin en plataforma: agencias, tasas globales, auditoría y auth-events; tenant_id NULL en rutas de plataforma.</text>
  <text x="32" y="870" class="note">[5] 403 / 404 / 409 y 422 se traducen desde es/en; foco visible, teclado y etiquetas en todos los controles; sin secretos ni mensajes internos.</text>
</svg>
