<rect x="308" y="1010" width="68" height="30" rx="15" class="chip"/><text x="342" y="1030" text-anchor="middle" class="small">Vuelos</text>
<text x="64" y="1070" class="lbl">Destino</text><rect x="62" y="1078" width="314" height="42" rx="4" class="field"/><text x="74" y="1104" class="val">¿A dónde quieres ir? ▾</text>
<text x="64" y="1148" class="lbl">Fecha de ida</text><rect x="62" y="1156" width="314" height="42" rx="4" class="field"/><text x="74" y="1182" class="val">Seleccionar fecha</text>
<text x="64" y="1226" class="lbl">Fecha de regreso</text><rect x="62" y="1234" width="314" height="42" rx="4" class="field"/><text x="74" y="1260" class="val">Seleccionar fecha</text>
<text x="64" y="1304" class="lbl">Adultos</text><rect x="62" y="1312" width="145" height="42" rx="4" class="field"/><text x="74" y="1338" class="val">2 adultos  −  +</text>
<text x="224" y="1304" class="lbl">Niños</text><rect x="218" y="1312" width="158" height="42" rx="4" class="field"/><text x="230" y="1338" class="val">0 niños  −  +</text>
