<rect x="40" y="64" width="358" height="844" class="ph"/>
<path d="M40 64 L398 908 M398 64 L40 908" stroke="#c8c8c8"/>
<rect x="40" y="64" width="358" height="844" fill="#333" opacity="0.25"/>
<rect x="52" y="78" width="334" height="52" rx="7" fill="#222" opacity="0.38" stroke="#fff" stroke-opacity="0.4"/>
<text x="68" y="111" class="white" font-size="21" font-weight="700">Caribe</text><text x="322" y="110" text-anchor="end" class="white" font-size="11">ES|EN</text><text x="354" y="110" text-anchor="end" class="white" font-size="13">☰</text>
<rect x="52" y="138" width="334" height="28" rx="5" fill="#fff" opacity="0.2" stroke="#fff" stroke-opacity="0.45"/>
<text x="219" y="157" text-anchor="middle" class="white" font-size="11">Tasa BCV 36,00 Bs/$ · 10/11/2026</text>
<text x="219" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#555">FOTOGRAFÍA HERO</text><text x="219" y="462" text-anchor="middle" class="lbl">Imagen panorámica a sangre</text>
<text x="62" y="555" class="heroSub">VIAJES · EXPERIENCIAS · VENEZUELA</text>
<text x="62" y="598" class="heroTitle">Tu próxima aventura</text><text x="62" y="632" class="heroTitle">comienza aquí.</text>
<text x="62" y="668" class="heroSub">Descubre destinos, hoteles, paquetes y tours.</text>
<rect x="62" y="704" width="170" height="42" rx="5" fill="#fff"/><text x="147" y="730" text-anchor="middle" class="h3">Explorar destinos</text>
<text x="219" y="876" text-anchor="middle" class="white" font-size="11">Desliza para descubrir  ↓</text>
