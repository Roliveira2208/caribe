<text x="56" y="1520" class="h2">Destinos destacados</text>
<rect x="56" y="1540" width="314" height="108" rx="6" class="box"/><rect x="68" y="1552" width="110" height="84" class="ph"/><text x="194" y="1584" class="h3">Los Roques</text><text x="194" y="1606" class="small">Playas y cayos</text>
<rect x="56" y="1660" width="314" height="108" rx="6" class="box"/><rect x="68" y="1672" width="110" height="84" class="ph"/><text x="194" y="1704" class="h3">Isla de Margarita</text><text x="194" y="1726" class="small">Sol, playas y gastronomía</text>
<text x="56" y="1810" class="h2">Tours y experiencias</text><rect x="56" y="1830" width="314" height="78" rx="6" class="box"/><text x="72" y="1858" class="h3">Tour Cayo de Agua</text><text x="72" y="1877" class="small">Los Roques · $120 USD ≈ 4.320,00 Bs</text><text x="72" y="1897" class="small">tasa BCV 10/11/2026 (informativo)</text>
<!-- Anotaciones -->
<rect x="450" y="48" width="360" height="1888" class="notes"/>
<text x="468" y="78" class="notetitle">Reglas visibles en esta pantalla</text>
<text x="468" y="112" class="note">[1] Hero de altura completa en móvil</text><text x="468" y="130" class="note">(100vh). No debe quedar reducido a una</text><text x="468" y="148" class="note">franja ni compartir pantalla con el buscador.</text><text x="468" y="166" class="note">El header muestra la tasa BCV del día y su fecha.</text>
<text x="468" y="188" class="note">[2] Al desplazarse aparece el buscador;</text><text x="468" y="206" class="note">categorías en chips horizontales y campos</text><text x="468" y="224" class="note">apilados para facilitar el uso táctil.</text>
<text x="468" y="264" class="note">[3] Campos: destino, ida, regreso, adultos</text><text x="468" y="282" class="note">y niños. Las edades se solicitan cuando</text><text x="468" y="300" class="note">se agregan menores.</text>
<text x="468" y="340" class="note">[4] Menú compacto tipo hamburguesa;</text><text x="468" y="358" class="note">al abrirse muestra Inicio, Tours, Hoteles,</text><text x="468" y="376" class="note">Paquetes, Destinos, Vuelos y Contacto.</text>
<text x="468" y="416" class="note">[5] Las tarjetas de destinos y experiencias</text><text x="468" y="434" class="note">enlazan con búsqueda y detalle de producto.</text>
<text x="468" y="474" class="note">La búsqueda mantiene precios USD y VES</text><text x="468" y="492" class="note">con tasa BCV y fecha valor en resultados.</text>
<text x="468" y="550" class="small">La página es más larga que el viewport: el</text><text x="468" y="568" class="small">usuario recorre los módulos con scroll.</text>
<text x="468" y="620" class="notetitle">Accesibilidad + textos es / en</text>
<text x="468" y="646" class="note">[6] Foco visible, etiquetas y contraste AA; zonas</text><text x="468" y="664" class="note">táctiles ≥ 44 × 44 px.</text>
<text x="468" y="692" class="note">es: Inicio · Tours · Hoteles · Explorar destinos</text>
<text x="468" y="712" class="note">en: Home · Tours · Hotels · Explore destinations</text>
<text x="468" y="732" class="note">es: Destino · Fechas · Adultos · Niños · Buscar</text>
<text x="468" y="752" class="note">en: Destination · Dates · Adults · Children · Search</text>
