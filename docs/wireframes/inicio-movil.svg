<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 1980" width="830" height="1980" role="img" aria-labelledby="wf-title wf-desc">
<rect id="canvas-bg" x="0" y="0" width="830" height="1980" fill="#ffffff"/>

<title id="wf-title">Inicio — móvil</title>
<desc id="wf-desc">Wireframe móvil de Caribe. El Hero ocupa toda la primera pantalla móvil y el buscador se presenta al hacer scroll, con categorías en chips y campos apilados.</desc>
<style>
 text{font-family:"Segoe UI",system-ui,sans-serif;fill:#333}.cap{font-size:13px;fill:#777}.h1{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.h3{font-size:13px;font-weight:700}.lbl{font-size:10.5px;fill:#555}.val{font-size:11px}.small{font-size:10px;fill:#666}.heroTitle{font-size:27px;font-weight:700;fill:#fff}.heroSub{font-size:12px;fill:#fff}.white{fill:#fff}.phone{fill:#fff;stroke:#666;stroke-width:1.5}.box{fill:#fff;stroke:#888;stroke-width:1}.panel{fill:#f7f7f7;stroke:#888;stroke-width:1}.field{fill:#fff;stroke:#999;stroke-width:1}.ph{fill:#e7e7e7;stroke:#aaa;stroke-width:1}.line{fill:#e5e5e5}.btnbox{fill:#e7e7e7;stroke:#666;stroke-width:1}.chip{fill:#fff;stroke:#777;stroke-width:1}.selected{fill:#e5e5e5;stroke:#555;stroke-width:1}.notes{fill:#fff;stroke:#888;stroke-width:1.2;stroke-dasharray:6 4}.note{font-size:11px;fill:#555}.notetitle{font-size:13px;font-weight:700}.rule{stroke:#777;stroke-width:1.2;stroke-dasharray:7 5}.mark{fill:#fff;stroke:#555;stroke-width:1}.marktxt{font-size:11px;font-weight:700}
</style>
<text x="16" y="28" class="cap">Caribe · Web — Inicio · móvil · wireframe de baja fidelidad · Hero = 100vh · es / en</text>
