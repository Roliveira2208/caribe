<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="wf-title wf-desc">
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <title id="wf-title">Panel de auditoría — admin</title>
  <desc id="wf-desc">Wireframe de baja fidelidad del visor de auditoría y eventos de autenticación: pestañas, filtros por acción/entidad/actor/rango o ruta/outcome, tabla con antes y después, paginación por cursor, alcance por agencia o plataforma y sin secretos.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .abtn { font-size: 11px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .chip { fill: #fff; stroke: #777; stroke-width: 1; }
    .active { fill: #0E2A3D; stroke: #0E2A3D; }
    .activeText { font-size: 12.5px; font-weight: 600; fill: #fff; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .sep { stroke: #ddd; stroke-width: 1; }
  </style>

  <text x="16" y="28" class="cap">Caribe Admin — Auditoría · escritorio · wireframe de baja fidelidad · es / en</text>

  <!-- Header del panel -->
  <rect x="16" y="44" width="1168" height="44" class="box"/>
  <text x="32" y="72" class="h1">Caribe Admin</text>
  <rect x="724" y="56" width="252" height="22" class="chip"/>
  <text x="736" y="72" class="lbl">Admin de agencia · Agencia Sol</text>
  <text x="992" y="72" class="lbl">o Super Admin · plataforma</text>
  <text x="1116" y="72" class="lbl">ES | EN</text>

  <!-- Pestañas -->
  <rect x="16" y="100" width="1168" height="36" class="panel"/>
  <rect x="24" y="106" width="112" height="24" class="active"/>
  <text x="38" y="122" class="activeText">Auditoría</text>
  <rect x="144" y="106" width="220" height="24" class="chip"/>
  <text x="156" y="122" class="lbl">Eventos de autenticación</text>
  <text x="392" y="122" class="note">Solo lectura · agente y member: 403, sin resumen ni enlaces</text>

  <!-- Filtros de auditoría -->
  <text x="16" y="158" class="lbl">Acción</text>
  <rect x="16" y="166" width="152" height="32" class="field"/>
  <text x="28" y="187" class="val">Todas ▾</text>
  <text x="184" y="158" class="lbl">Entidad</text>
  <rect x="184" y="166" width="152" height="32" class="field"/>
  <text x="196" y="187" class="val">Todas ▾</text>
  <text x="352" y="158" class="lbl">Actor</text>
  <rect x="352" y="166" width="152" height="32" class="field"/>
  <text x="364" y="187" class="val">Todos ▾</text>
  <text x="520" y="158" class="lbl">Desde</text>
  <rect x="520" y="166" width="132" height="32" class="field"/>
  <text x="532" y="187" class="val">25/11/2026</text>
  <text x="668" y="158" class="lbl">Hasta</text>
  <rect x="668" y="166" width="132" height="32" class="field"/>
  <text x="680" y="187" class="val">25/11/2026</text>
  <rect x="824" y="166" width="120" height="32" class="btnbox"/>
  <text x="884" y="187" class="btn" text-anchor="middle">Exportar CSV</text>
  <text x="960" y="170" class="note">Deseable: mismos filtros y columnas permitidas</text>
  <text x="960" y="187" class="note">En Eventos: Ruta · Outcome · rango · cursor</text>

  <!-- Tabla -->
  <rect x="16" y="216" width="1168" height="304" class="box"/>
  <rect x="16" y="216" width="1168" height="32" class="panel"/>
  <text x="32" y="237" class="lbl">Fecha</text>
  <text x="150" y="237" class="lbl">Actor</text>
  <text x="288" y="237" class="lbl">Acción / ruta</text>
  <text x="456" y="237" class="lbl">Entidad</text>
  <text x="592" y="237" class="lbl">Antes → después</text>
  <text x="830" y="237" class="lbl">IP</text>
  <text x="920" y="237" class="lbl">Resultado</text>
  <text x="1040" y="237" class="lbl">Ámbito</text>

  <line x1="16" y1="248" x2="1184" y2="248" class="sep"/>
  <text x="32" y="274" class="val">25/11 13:42</text>
  <text x="150" y="274" class="val">admin@sol</text>
  <text x="288" y="274" class="val">exchange-rate.override</text>
  <text x="456" y="274" class="val">ExchangeRate</text>
  <text x="592" y="274" class="val">36.0000 → 950.0000</text>
  <text x="830" y="274" class="val">10.0.0.4</text>
  <rect x="920" y="260" width="96" height="24" class="chip"/>
  <text x="930" y="276" class="lbl">OK</text>
  <text x="1040" y="274" class="val">Agencia Sol</text>

  <line x1="16" y1="292" x2="1184" y2="292" class="sep"/>
  <text x="32" y="318" class="val">25/11 13:10</text>
  <text x="150" y="318" class="val">owner@sol</text>
  <text x="288" y="318" class="val">payment.approve</text>
  <text x="456" y="318" class="val">PAG-0142</text>
  <text x="592" y="318" class="val">IN_REVIEW → APPROVED</text>
  <text x="830" y="318" class="val">10.0.0.4</text>
  <rect x="920" y="304" width="96" height="24" class="chip"/>
  <text x="930" y="320" class="lbl">OK</text>
  <text x="1040" y="318" class="val">Agencia Sol</text>

  <line x1="16" y1="336" x2="1184" y2="336" class="sep"/>
  <text x="32" y="362" class="val">25/11 12:55</text>
  <text x="150" y="362" class="val">sistema</text>
  <text x="288" y="362" class="val">auth.login</text>
  <text x="456" y="362" class="val">Session</text>
  <text x="592" y="362" class="val">—</text>
  <text x="830" y="362" class="lbl">null</text>
  <rect x="920" y="348" width="96" height="24" class="chip"/>
  <text x="930" y="364" class="lbl">SUCCESS</text>
  <text x="1040" y="362" class="val">Plataforma</text>

  <line x1="16" y1="380" x2="1184" y2="380" class="sep"/>
  <rect x="32" y="396" width="88" height="10" class="line"/>
  <rect x="150" y="396" width="92" height="10" class="line"/>
  <rect x="288" y="396" width="124" height="10" class="line"/>
  <rect x="456" y="396" width="84" height="10" class="line"/>
  <rect x="592" y="396" width="140" height="10" class="line"/>
  <rect x="830" y="396" width="60" height="10" class="line"/>
  <rect x="920" y="396" width="72" height="10" class="line"/>
  <rect x="1040" y="396" width="88" height="10" class="line"/>
  <line x1="16" y1="424" x2="1184" y2="424" class="sep"/>
  <rect x="32" y="440" width="88" height="10" class="line"/>
  <rect x="150" y="440" width="92" height="10" class="line"/>
  <rect x="288" y="440" width="124" height="10" class="line"/>
  <rect x="456" y="440" width="84" height="10" class="line"/>
  <rect x="592" y="440" width="140" height="10" class="line"/>
  <rect x="830" y="440" width="60" height="10" class="line"/>
  <rect x="920" y="440" width="72" height="10" class="line"/>
  <rect x="1040" y="440" width="88" height="10" class="line"/>
  <line x1="16" y1="468" x2="1184" y2="468" class="sep"/>
  <rect x="32" y="484" width="88" height="10" class="line"/>
  <rect x="150" y="484" width="92" height="10" class="line"/>
  <rect x="288" y="484" width="124" height="10" class="line"/>
  <rect x="456" y="484" width="84" height="10" class="line"/>
  <rect x="592" y="484" width="140" height="10" class="line"/>
  <rect x="830" y="484" width="60" height="10" class="line"/>
  <rect x="920" y="484" width="72" height="10" class="line"/>
  <rect x="1040" y="484" width="88" height="10" class="line"/>

  <!-- Cursor del servidor -->
  <text x="16" y="546" class="lbl">Página 1 · cursor opaco</text>
  <rect x="172" y="532" width="104" height="26" class="btnbox"/>
  <text x="224" y="549" class="abtn" text-anchor="middle">Anterior</text>
  <rect x="288" y="532" width="104" height="26" class="btnbox"/>
  <text x="340" y="549" class="abtn" text-anchor="middle">Siguiente</text>
  <text x="420" y="549" class="note">Último cursor = null · sin totales globales ni filas de otra agencia</text>

  <!-- Estados vacío y de error -->
  <rect x="16" y="570" width="1168" height="44" class="notes"/>
  <text x="32" y="587" class="notetitle">Estados</text>
  <text x="32" y="605" class="note">Vacío: «Sin registros con estos filtros» · Error 403 / ACTIVE_ORGANIZATION_REQUIRED: elegir agencia válida · el foco va al aviso</text>

  <!-- Notas -->
  <text x="16" y="638" class="note">[1] Admin de agencia: solo su tenant; Super Admin en plataforma: tenant NULL y todas las agencias, solo lectura.</text>
  <text x="16" y="656" class="note">[2] Filtros por acción, entidad, actor y rango de fechas; el cursor lo emite la API y no se construye en la UI.</text>
  <text x="16" y="674" class="note">[3] Pestaña de eventos: filtros por ruta, outcome y rango con el mismo alcance y cursor; sin botones de escritura.</text>
  <text x="16" y="692" class="note">[4] Agente y member: 403 en la API; ni resumen, ni pestaña, ni enlaces en la interfaz.</text>
  <text x="16" y="710" class="note">[5] Sin secretos: no contraseñas, tokens, cookies, cuerpos completos ni mensajes internos; IP puede ser null y no se confía en reenvíos.</text>
  <text x="16" y="728" class="note">[6] CSV (deseable): mismos filtros, columnas permitidas, cabeceras es/en y control accesible por teclado.</text>
  <text x="16" y="748" class="cap">Textos visibles desde mensajes es/en · foco visible · tabla navegable por teclado</text>
</svg>
