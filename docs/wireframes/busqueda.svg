<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Búsqueda — escritorio</title>
  <desc id="wf-desc">Wireframe de baja fidelidad de la búsqueda de la web: buscador (destino, fechas, personas, tipo), filtros y resultados con precio en USD y equivalente en VES a la tasa BCV con su fecha valor.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .price { font-size: 17px; font-weight: 700; }
    .ves { font-size: 11.5px; fill: #555; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .ph { fill: #f2f2f2; stroke: #bbb; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .chk { fill: #fff; stroke: #777; stroke-width: 1; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .mark { fill: #fff; stroke: #666; stroke-width: 1.2; }
    .marktxt { font-size: 12px; font-weight: 700; }
    .x { stroke: #ccc; stroke-width: 1; }
  </style>

  <!-- Encabezado del wireframe -->
  <text x="16" y="28" class="cap">Caribe · Web — Búsqueda · escritorio · wireframe de baja fidelidad · es</text>

  <!-- Header del sitio -->
  <rect x="16" y="44" width="1168" height="44" class="box"/>
  <text x="32" y="72" class="h1">Caribe</text>
  <text x="975" y="72" class="lbl">Iniciar sesión</text>
  <text x="1082" y="72" class="lbl">ES | EN</text>

  <!-- Buscador -->
  <rect x="16" y="100" width="1168" height="76" class="panel"/>
  <rect x="32" y="116" width="230" height="44" class="field"/>
  <text x="44" y="143" class="val">Destino: Los Roques ▾</text>
  <rect x="274" y="116" width="250" height="44" class="field"/>
  <text x="286" y="143" class="val">15/11/2026 → 18/11/2026</text>
  <rect x="536" y="116" width="140" height="44" class="field"/>
  <text x="548" y="143" class="val">2 adultos ▾</text>
  <rect x="688" y="116" width="150" height="44" class="field"/>
  <text x="700" y="143" class="val">Tipo: Tour ▾</text>
  <rect x="850" y="116" width="110" height="44" class="btnbox"/>
  <text x="905" y="143" class="btn" text-anchor="middle">Buscar</text>

  <!-- Filtros -->
  <rect x="16" y="192" width="220" height="560" class="box"/>
  <text x="32" y="222" class="h2">Filtros</text>
  <text x="32" y="252" class="lbl">Destino</text>
  <rect x="32" y="264" width="12" height="12" class="chk"/>
  <text x="52" y="275" class="val">Los Roques</text>
  <rect x="32" y="290" width="12" height="12" class="chk"/>
  <text x="52" y="301" class="val">Morrocoy</text>
  <rect x="32" y="316" width="12" height="12" class="chk"/>
  <text x="52" y="327" class="val">Mérida</text>
  <text x="32" y="362" class="lbl">Tipo</text>
  <rect x="32" y="374" width="12" height="12" class="chk"/>
  <text x="52" y="385" class="val">Tour</text>
  <rect x="32" y="400" width="12" height="12" class="chk"/>
  <text x="52" y="411" class="val">Hotel</text>
  <rect x="32" y="426" width="12" height="12" class="chk"/>
  <text x="52" y="437" class="val">Paquete</text>
  <rect x="32" y="452" width="12" height="12" class="chk"/>
  <text x="52" y="463" class="val">Vuelo</text>
  <text x="32" y="498" class="lbl">Precio (USD)</text>
  <rect x="32" y="510" width="90" height="32" class="field"/>
  <text x="42" y="531" class="lbl">mín</text>
  <rect x="130" y="510" width="90" height="32" class="field"/>
  <text x="140" y="531" class="lbl">máx</text>
  <rect x="32" y="560" width="100" height="36" class="btnbox"/>
  <text x="82" y="583" class="btn" text-anchor="middle">Aplicar</text>
  <text x="32" y="630" class="note">Filtros combinables con la búsqueda.</text>

  <!-- Resultados -->
  <text x="252" y="222" class="h2">23 resultados · Los Roques</text>
  <text x="1050" y="222" class="lbl">Ordenar por: precio ▾</text>

  <!-- Tarjeta 1 -->
  <rect x="252" y="236" width="932" height="152" class="box"/>
  <rect x="268" y="252" width="130" height="120" class="ph"/>
  <line x1="268" y1="252" x2="398" y2="372" class="x"/>
  <line x1="398" y1="252" x2="268" y2="372" class="x"/>
  <text x="420" y="286" class="h2">Tour Cayo de Agua</text>
  <text x="420" y="308" class="lbl">Los Roques · Tour · 1 día · cupos: 8</text>
  <rect x="420" y="322" width="220" height="8" class="line"/>
  <rect x="420" y="338" width="170" height="8" class="line"/>
  <rect x="420" y="350" width="110" height="34" class="btnbox"/>
  <text x="475" y="372" class="btn" text-anchor="middle">Ver detalle</text>
  <circle cx="1018" cy="295" r="11" class="mark"/>
  <text x="1018" y="299" class="marktxt" text-anchor="middle">1</text>
  <text x="1156" y="300" class="price" text-anchor="end">$120 USD</text>
  <text x="1156" y="322" class="ves" text-anchor="end">≈ 4.320,00 Bs · tasa BCV 10/11/2026</text>

  <!-- Tarjeta 2 -->
  <rect x="252" y="404" width="932" height="152" class="box"/>
  <rect x="268" y="420" width="130" height="120" class="ph"/>
  <line x1="268" y1="420" x2="398" y2="540" class="x"/>
  <line x1="398" y1="420" x2="268" y2="540" class="x"/>
  <rect x="420" y="454" width="260" height="14" class="line"/>
  <rect x="420" y="480" width="300" height="10" class="line"/>
  <rect x="420" y="498" width="110" height="34" class="btnbox"/>
  <text x="475" y="520" class="btn" text-anchor="middle">Ver detalle</text>
  <text x="1156" y="468" class="price" text-anchor="end">$95 USD</text>
  <text x="1156" y="490" class="ves" text-anchor="end">≈ 3.420,00 Bs · tasa BCV 10/11/2026</text>

  <!-- Tarjeta 3 -->
  <rect x="252" y="572" width="932" height="152" class="box"/>
  <rect x="268" y="588" width="130" height="120" class="ph"/>
  <line x1="268" y1="588" x2="398" y2="708" class="x"/>
  <line x1="398" y1="588" x2="268" y2="708" class="x"/>
  <text x="420" y="622" class="h2">Hotel Posada Malvin</text>
  <text x="420" y="644" class="lbl">Los Roques · Hotel · 3 noches</text>
  <rect x="420" y="658" width="220" height="8" class="line"/>
  <rect x="420" y="674" width="160" height="8" class="line"/>
  <rect x="420" y="686" width="110" height="34" class="btnbox"/>
  <text x="475" y="708" class="btn" text-anchor="middle">Ver detalle</text>
  <text x="1156" y="636" class="price" text-anchor="end">$60 USD</text>
  <text x="1156" y="658" class="ves" text-anchor="end">≈ 2.160,00 Bs · tasa BCV 10/11/2026</text>

  <text x="252" y="752" class="lbl">Página 1 de 8 · 1 2 3 4 … →</text>

  <!-- Reglas visibles -->
  <rect x="16" y="768" width="1168" height="110" class="notes"/>
  <text x="32" y="792" class="notetitle">Reglas visibles en esta pantalla</text>
  <text x="32" y="814" class="note">[1] Precio en USD con el equivalente en VES a la tasa BCV vigente y su fecha valor; en el catálogo el equivalente es informativo.</text>
  <text x="32" y="834" class="note">[2] Lista filtrable (destino, tipo, precio en USD) y ordenable; cada tarjeta lleva el CTA «Ver detalle».</text>
  <text x="32" y="854" class="note">[3] Versión móvil de esta pantalla: busqueda-movil.svg (misma información, columna única).</text>
</svg>
