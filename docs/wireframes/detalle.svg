<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Detalle de producto — escritorio</title>
  <desc id="wf-desc">Wireframe de baja fidelidad del detalle de producto: galería, descripción, qué incluye, política de cancelación, tarjeta de reserva con precio en USD y equivalente en VES a la tasa BCV, tabla de disponibilidad por fecha y CTA de reserva con nota de retención del cupo.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #333; }
    .cap { font-size: 13px; fill: #777; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #555; }
    .val { font-size: 12px; fill: #333; }
    .price { font-size: 17px; font-weight: 700; }
    .ves { font-size: 11.5px; fill: #555; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #333; }
    .box { fill: #fff; stroke: #888; stroke-width: 1.2; }
    .panel { fill: #f7f7f7; stroke: #888; stroke-width: 1.2; }
    .field { fill: #fff; stroke: #999; stroke-width: 1; }
    .ph { fill: #f2f2f2; stroke: #bbb; stroke-width: 1; }
    .line { fill: #e8e8e8; }
    .btnbox { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .notes { fill: #fff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .note { font-size: 11.5px; fill: #555; }
    .notetitle { font-size: 13px; font-weight: 700; fill: #444; }
    .mark { fill: #fff; stroke: #666; stroke-width: 1.2; }
    .marktxt { font-size: 12px; font-weight: 700; }
    .x { stroke: #ccc; stroke-width: 1; }
    .sep { stroke: #ddd; stroke-width: 1; }
    .dot { fill: #999; }
  </style>

  <!-- Encabezado del wireframe -->
  <text x="16" y="28" class="cap">Caribe · Web — Detalle de producto · escritorio · wireframe de baja fidelidad · es</text>

  <!-- Header del sitio -->
  <rect x="16" y="44" width="1168" height="44" class="box"/>
  <text x="32" y="72" class="h1">Caribe</text>
  <text x="975" y="72" class="lbl">Iniciar sesión</text>
  <text x="1082" y="72" class="lbl">ES | EN</text>

  <!-- Breadcrumb y título -->
  <text x="16" y="120" class="lbl">Inicio › Los Roques › Tour Cayo de Agua</text>
  <text x="16" y="160" class="h1">Tour Cayo de Agua</text>
  <text x="16" y="184" class="lbl">Los Roques · Tour · 1 día · cupos: 8</text>

  <!-- Columna izquierda: galería, descripción, incluye, política -->
  <rect x="16" y="200" width="640" height="280" class="ph"/>
  <line x1="16" y1="200" x2="656" y2="480" class="x"/>
  <line x1="656" y1="200" x2="16" y2="480" class="x"/>
  <text x="336" y="346" class="lbl" text-anchor="middle">galería · foto principal</text>

  <rect x="16" y="492" width="148" height="100" class="ph"/>
  <line x1="16" y1="492" x2="164" y2="592" class="x"/>
  <line x1="164" y1="492" x2="16" y2="592" class="x"/>
  <rect x="176" y="492" width="148" height="100" class="ph"/>
  <line x1="176" y1="492" x2="324" y2="592" class="x"/>
  <line x1="324" y1="492" x2="176" y2="592" class="x"/>
  <rect x="336" y="492" width="148" height="100" class="ph"/>
  <line x1="336" y1="492" x2="484" y2="592" class="x"/>
  <line x1="484" y1="492" x2="336" y2="592" class="x"/>
  <rect x="496" y="492" width="148" height="100" class="ph"/>
  <line x1="496" y1="492" x2="644" y2="592" class="x"/>
  <line x1="644" y1="492" x2="496" y2="592" class="x"/>

  <text x="16" y="628" class="h2">Descripción</text>
  <rect x="16" y="638" width="560" height="8" class="line"/>
  <rect x="16" y="654" width="480" height="8" class="line"/>
  <rect x="16" y="670" width="520" height="8" class="line"/>

  <text x="16" y="706" class="h2">Qué incluye</text>
  <circle cx="22" cy="720" r="3" class="dot"/>
  <text x="32" y="724" class="lbl">Traslado en lancha desde el muelle</text>
  <circle cx="22" cy="738" r="3" class="dot"/>
  <text x="32" y="742" class="lbl">Almuerzo y bebidas</text>
  <circle cx="22" cy="756" r="3" class="dot"/>
  <text x="32" y="760" class="lbl">Equipo de snorkel</text>
  <circle cx="22" cy="774" r="3" class="dot"/>
  <text x="32" y="778" class="lbl">Guía bilingüe</text>

  <text x="16" y="812" class="h2">Política de cancelación</text>
  <text x="16" y="834" class="note">Gratis hasta 48 h antes del inicio · después retiene el 50 %.</text>

  <!-- Columna derecha: tarjeta de reserva -->
  <rect x="672" y="200" width="512" height="372" class="panel"/>
  <text x="688" y="228" class="h2">Reservar</text>
  <circle cx="694" cy="270" r="11" class="mark"/>
  <text x="694" y="274" class="marktxt" text-anchor="middle">1</text>
  <text x="712" y="276" class="price">$120 USD · por persona</text>
  <text x="712" y="298" class="ves">≈ 4.320,00 Bs · tasa BCV 10/11/2026 (informativo)</text>
  <line x1="688" y1="316" x2="1148" y2="316" class="sep"/>
  <text x="712" y="338" class="lbl">Fecha</text>
  <rect x="712" y="346" width="260" height="36" class="field"/>
  <text x="724" y="369" class="val">15/11/2026 · 8 cupos</text>
  <text x="712" y="404" class="lbl">Personas</text>
  <rect x="712" y="412" width="36" height="36" class="btnbox"/>
  <text x="730" y="435" class="btn" text-anchor="middle">-</text>
  <text x="770" y="435" class="val">2 adultos</text>
  <rect x="860" y="412" width="36" height="36" class="btnbox"/>
  <text x="878" y="435" class="btn" text-anchor="middle">+</text>
  <line x1="688" y1="468" x2="1148" y2="468" class="sep"/>
  <text x="712" y="490" class="lbl">Total</text>
  <text x="712" y="514" class="price">$240 USD</text>
  <text x="712" y="536" class="ves">≈ 8.640,00 Bs · tasa BCV 10/11/2026</text>
  <rect x="956" y="532" width="208" height="36" class="btnbox"/>
  <text x="1060" y="555" class="btn" text-anchor="middle">Reservar</text>
  <circle cx="694" cy="600" r="11" class="mark"/>
  <text x="694" y="604" class="marktxt" text-anchor="middle">2</text>
  <text x="712" y="604" class="note">Al continuar, la reserva queda PENDING_PAYMENT con el cupo retenido 30 min.</text>

  <!-- Tabla de disponibilidad por fecha -->
  <circle cx="680" cy="644" r="11" class="mark"/>
  <text x="680" y="648" class="marktxt" text-anchor="middle">3</text>
  <text x="700" y="648" class="h2">Disponibilidad por fecha</text>
  <rect x="672" y="660" width="512" height="160" class="box"/>
  <rect x="672" y="660" width="512" height="28" class="panel"/>
  <text x="684" y="679" class="lbl">Fecha</text>
  <text x="806" y="679" class="lbl">Cupos</text>
  <text x="886" y="679" class="lbl">Precio USD</text>
  <text x="986" y="679" class="lbl">VES (informativo)</text>
  <line x1="672" y1="688" x2="1184" y2="688" class="sep"/>
  <text x="684" y="708" class="val">15/11/2026</text>
  <text x="806" y="708" class="val">8</text>
  <text x="886" y="708" class="val">$120</text>
  <text x="986" y="708" class="val">4.320,00 Bs</text>
  <line x1="672" y1="720" x2="1184" y2="720" class="sep"/>
  <text x="684" y="740" class="val">16/11/2026</text>
  <text x="806" y="740" class="val">6</text>
  <text x="886" y="740" class="val">$120</text>
  <text x="986" y="740" class="val">4.320,00 Bs</text>
  <line x1="672" y1="752" x2="1184" y2="752" class="sep"/>
  <text x="684" y="772" class="val">22/11/2026</text>
  <text x="806" y="772" class="val">12</text>
  <text x="886" y="772" class="val">$135</text>
  <text x="986" y="772" class="val">4.860,00 Bs</text>
  <line x1="672" y1="784" x2="1184" y2="784" class="sep"/>
  <text x="688" y="838" class="note">El cupo se bloquea en una transacción al reservar; no hay sobreventa.</text>

  <!-- Reglas visibles -->
  <rect x="16" y="880" width="1168" height="100" class="notes"/>
  <text x="32" y="904" class="notetitle">Reglas visibles en esta pantalla</text>
  <text x="32" y="926" class="note">[1] Precio en USD; el equivalente en VES es informativo y se calcula con la tasa BCV vigente y su fecha valor.</text>
  <text x="32" y="946" class="note">[2] Al continuar se retiene el cupo 30 min (hold_minutes): la reserva queda PENDING_PAYMENT hasta pagar o expirar.</text>
  <text x="32" y="966" class="note">[3] Disponibilidad y precio por fecha; el cupo se bloquea en una transacción (cero sobreventa).</text>
</svg>
