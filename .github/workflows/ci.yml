# Verificación continua: lint, typecheck, tests, build y validación de specs.
# Servicios igual que docker compose local: PostgreSQL 17 y Redis 7.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caribe_ci
          POSTGRES_PASSWORD: caribe_ci_password
          POSTGRES_DB: caribe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caribe_ci -d caribe_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://caribe_ci:caribe_ci_password@localhost:5432/caribe_ci?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # La versión de pnpm sale de packageManager en package.json (12.18.0).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6.1.1

      # Node fijado a la misma versión del entorno de desarrollo; engines exige >=24.
      - name: Instalar Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # schema.prisma y las migraciones deben contar la misma historia: el diff
      # replayea las migraciones en una BD vacia (shadow) y las compara con el
      # schema (exit 0 = sin diferencia, 2 = divergen, 1 = error de replay).
      # Prisma 7 exige que la shadow venga del config (SHADOW_DATABASE_URL).
      - name: Comprobar divergencia entre schema.prisma y las migraciones
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE caribe_ci_shadow"
          pnpm --filter @caribe/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://caribe_ci:caribe_ci_password@localhost:5432/caribe_ci_shadow

      # Los e2e de la API (Better Auth) necesitan las tablas: la BD del servicio
      # arranca vacia y las migraciones son la unica via de crear el esquema.
      - name: Aplicar migraciones
        run: pnpm db:migrate:deploy

      - name: Tests
        run: pnpm test

      # Build completo del monorepo: dist de shared y de la API, y las dos apps
      # de Next (Turbopack, SSG de /es y /en). No necesita BD ni secretos: las
      # URL publicas tienen defaults locales (WEB_URL/ADMIN_URL) y el proxy de
      # la API solo se usa en runtime.
      - name: Build
        run: pnpm build

      - name: Validar specs
        run: node scripts/check-specs.mjs
