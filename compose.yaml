# Servicios locales de desarrollo: PostgreSQL, Redis y Mailpit (SMTP local).
# Las apps corren aparte con pnpm dev; esto solo levanta los almacenes.
name: caribe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caribe_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caribe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-caribe_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caribe_dev} -d ${POSTGRES_DB:-caribe_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP de desarrollo: los correos no salen a Internet, se ven en la web.
  # Ningún puerto se solapa con PostgreSQL (5433) ni Redis (6380).
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
